<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 赫拉啟動頁（2026/11/26）：讓 iPhone 主畫面有玫瑰粉 H 圖示、全螢幕打開，裡面載入赫拉庫存。
     共用碼不寫在這個檔案裡：加入主畫面時的網址帶 ?u=名字&k=共用碼，這頁原樣轉給赫拉庫存。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="赫拉庫存">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>赫拉庫存</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  /* iPhone 瀏海、底部橫條的留白放在外面這層（裡面的赫拉庫存讀不到安全區域） */
  .wrap { position: fixed; inset: 0; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; display: flex; }
  iframe { flex: 1; width: 100%; height: 100%; border: 0; display: block; }
  .load { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px -apple-system, "PingFang TC", sans-serif; color: #8a6470; background: #fff; transition: opacity .3s; }
  .load img { width: 88px; height: 88px; border-radius: 20px; display: block; margin: 0 auto 14px; }
  .load.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap"><iframe id="app" title="赫拉庫存" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe></div>
<div class="load" id="load"><div><img src="icon-192.png" alt="">赫拉庫存載入中…</div></div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbyyR55dMxAtpjbwk4KU2CWMDW9cgQFEGm7FzPBCF4EzvOfrHFEccP_E82OXPXVpM-CaqA/exec';
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ['u', 'k'].forEach(function (x) { if (q.get(x)) out.set(x, q.get(x)); });
  var f = document.getElementById('app');
  f.onload = function () { setTimeout(function () { document.getElementById('load').className = 'load hide'; }, 400); };
  f.src = EXEC + (out.toString() ? '?' + out.toString() : '');
  // 太久沒載入（網路慢）也把載入畫面拿掉，看得到 Google 的畫面或錯誤
  setTimeout(function () { document.getElementById('load').className = 'load hide'; }, 12000);
</script>
</body>
</html>
